{% set name = "sphinx-basic-ng" %}
{% set version = "1.0.0b2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/sphinx_basic_ng-{{ version }}.tar.gz
  sha256: 9ec55a47c90c8c002b5960c57492ec3021f5193cb26cebc2dc4ea226848651c9

build:
  skip: True # [py<37]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - pip
    - python
  run:
    - python
    - sphinx >=4.0

test:
  imports:
    # This is a dirty hack because sphinx.application
    # isn't available with a simple `import sphinx`
    - sphinx.application
    - sphinx_basic_ng
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/pradyunsg/sphinx-basic-ng
  summary: A modern skeleton for Sphinx themes.
  description: |
    A modern base for Sphinx themes, providing shared implementation
    of common components and a three-column layout to build upon.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  dev_url: https://github.com/pradyunsg/sphinx-basic-ng
  doc_url: https://sphinx-basic-ng.readthedocs.io

extra:
  recipe-maintainers:
    - gforsyth
